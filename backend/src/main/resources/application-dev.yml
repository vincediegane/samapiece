spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:samapiece_dev}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

samapiece:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:samapiece_minio}
    secret-key: ${MINIO_SECRET_KEY:samapiece_minio_password}
    bucket-photos: ${MINIO_BUCKET_PHOTOS:samapiece-photos-dev}
  meilisearch:
    host: ${MEILISEARCH_HOST:http://localhost:7700}
    api-key: ${MEILISEARCH_API_KEY:samapiece_dev_master_key_change_me}
    index-pieces: ${MEILISEARCH_INDEX_PIECES:pieces}
  rate-limiting:
    recherche-publique:
      capacite: ${RATE_LIMIT_RECHERCHE_CAPACITE:10}
      periode-secondes: ${RATE_LIMIT_RECHERCHE_PERIODE_SECONDES:60}
  captcha:
    seuil-echecs-consecutifs: ${CAPTCHA_SEUIL_ECHECS:5}
    ttl-compteur-echecs-secondes: ${CAPTCHA_TTL_COMPTEUR_SECONDES:600}
    ttl-defi-secondes: ${CAPTCHA_TTL_DEFI_SECONDES:120}

logging:
  level:
    sn.samapiece: DEBUG
