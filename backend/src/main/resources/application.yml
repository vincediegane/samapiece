spring:
  application:
    name: samapiece-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SPRING_PROFILES_ACTIVE:dev}

samapiece:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    matricule: ${BOOTSTRAP_ADMIN_MATRICULE:}
    nom: ${BOOTSTRAP_ADMIN_NOM:}
    poste-id: ${BOOTSTRAP_ADMIN_POSTE_ID:}
  jwt:
    secret: ${JWT_SECRET}
  photo:
    cle-chiffrement: ${PHOTO_CLE_CHIFFREMENT}
  alerte:
    cle-chiffrement: ${ALERTE_CLE_CHIFFREMENT}
    token-expiration-heures: ${ALERTE_TOKEN_EXPIRATION_HEURES:8760}
    lien-desinscription-base-url: ${ALERTE_LIEN_DESINSCRIPTION_BASE_URL:https://www.samapiece.sn/desinscription-alerte}
  sms:
    api-endpoint: ${SMS_API_ENDPOINT}
    api-key: ${SMS_API_KEY}
    sender-id: ${SMS_SENDER_ID}
    timeout-ms: ${SMS_TIMEOUT_MS:5000}
  alerte-correspondance:
    max-tentatives: ${ALERTE_CORRESPONDANCE_MAX_TENTATIVES:3}
    intervalle-ms: 10000
    retry-delai-30s-ms: 30000
    retry-delai-2m-ms: 120000
    retry-delai-10m-ms: 600000
  reporting:
    seuil-anciennete-jours: ${SAMAPIECE_SEUIL_ANCIENNETE_JOURS:180}
