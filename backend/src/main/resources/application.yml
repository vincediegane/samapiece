spring:
  application:
    name: samapiece-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

samapiece:
  jwt:
    secret: ${JWT_SECRET}
