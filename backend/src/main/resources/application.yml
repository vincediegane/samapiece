spring:
  application:
    name: samapiece-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: false

samapiece:
  jwt:
    secret: ${JWT_SECRET}
  photo:
    cle-chiffrement: ${PHOTO_CLE_CHIFFREMENT}
  sms:
    api-endpoint: ${SMS_API_ENDPOINT}
    api-key: ${SMS_API_KEY}
    sender-id: ${SMS_SENDER_ID}
    timeout-ms: ${SMS_TIMEOUT_MS:5000}
    max-tentatives: ${SMS_MAX_TENTATIVES:3}
    retry-ttl-30s-ms: 30000
    retry-ttl-2m-ms: 120000
    retry-ttl-10m-ms: 600000
