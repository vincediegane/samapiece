management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    rabbit:
      enabled: false

sentry:
  dsn: ""
  environment: test

samapiece:
  # Limites larges par defaut : le rate limiting et le CAPTCHA sont desormais en memoire (actifs
  # dans tous les contextes de test) ; les tests dedies les resserrent via @DynamicPropertySource.
  rate-limiting:
    recherche-publique:
      capacite: 100000
  captcha:
    seuil-echecs-consecutifs: 100000
  jwt:
    secret: test-secret-uniquement-pour-les-tests-automatises-ne-jamais-reutiliser
  minio:
    endpoint: http://localhost:9000
    access-key: test-access-key
    secret-key: test-secret-key
    bucket-photos: samapiece-photos-test
  photo:
    cle-chiffrement: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  alerte:
    cle-chiffrement: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
    token-expiration-heures: 8760
    lien-desinscription-base-url: http://localhost/desinscription-alerte
  sms:
    api-endpoint: http://127.0.0.1:1
    api-key: test-api-key
    sender-id: SamaPiece
    timeout-ms: 1000
    max-tentatives: 3
    retry-ttl-30s-ms: 30000
    retry-ttl-2m-ms: 120000
    retry-ttl-10m-ms: 600000
  alerte-correspondance:
    max-tentatives: 3
    retry-ttl-30s-ms: 30000
    retry-ttl-2m-ms: 120000
    retry-ttl-10m-ms: 600000
