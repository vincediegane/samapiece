name: secrets-scan

on:
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  gitleaks-diff:
    # Portee reelle : gitleaks-action@v2 calcule sa propre plage de scan a partir du
    # contexte push/pull_request (commits introduits par cet evenement uniquement),
    # independamment de fetch-depth. Rapide, declenche a chaque push/PR pour un catch
    # immediat, mais NE scanne PAS l'historique complet du depot (voir job ci-dessous).
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan des secrets (gitleaks, commits introduits par ce push/PR)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  gitleaks-full-history:
    # Portee reelle : rescan de tout l'historique (--log-opts="--all") via l'image Docker
    # officielle gitleaks, qui ne depend pas du contexte push/PR. Planifie chaque lundi
    # et declenchable manuellement, en complement du job gitleaks-diff ci-dessus qui ne
    # couvre que le diff introduit par chaque evenement.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan des secrets (gitleaks, image Docker officielle, historique complet)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --log-opts="--all" --config /repo/.gitleaks.toml --redact --exit-code 1 -v
